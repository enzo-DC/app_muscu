<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fonte : on compte ses séries comme au crayon dans un carnet (4 traits + 1 barré) -->
  <!-- Fond papier plein : icône « maskable », le système peut la découper en rond -->
  <rect width="512" height="512" fill="#F5F1EA"/>
  <!-- Quadrillage de carnet -->
  <g stroke="#DDD6CA" stroke-width="4">
    <path d="M0 128H512M0 256H512M0 384H512M128 0V512M256 0V512M384 0V512"/>
  </g>
  <!-- Quatre bâtonnets à l'encre -->
  <g stroke="#1C1B19" stroke-width="34" stroke-linecap="round">
    <path d="M168 156V356M224 156V356M280 156V356M336 156V356"/>
  </g>
  <!-- Le cinquième, en travers : le seul accent -->
  <path d="M132 326L372 186" stroke="#C94A22" stroke-width="34" stroke-linecap="round"/>
</svg>
